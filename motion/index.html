<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEIBEI モーション</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #0a0a09; }
      body {
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        color: #c3c2b7;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 20px 16px 40px;
      }
      #stage {
        width: min(100%, 1280px);
        aspect-ratio: 16 / 9;
        display: block;
        background: #111110;
        border: 1px solid #2a2a26;
      }
      .bar { display: flex; align-items: center; gap: 12px; width: min(100%, 1280px); }
      #scrub { flex: 1; accent-color: #3987e5; }
      button {
        font: inherit;
        padding: 8px 18px;
        background: #1a1a19;
        color: #ffffff;
        border: 1px solid #34342f;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { border-color: #5a5a52; }
      button:disabled { opacity: 0.6; cursor: default; }
      #clock { font-variant-numeric: tabular-nums; font-size: 14px; color: #86857c; min-width: 220px; }
      p.hint { font-size: 13px; color: #86857c; margin: 0; width: min(100%, 1280px); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="bar">
      <button id="play" type="button">再生</button>
      <input id="scrub" type="range" min="0" max="100" step="1" value="0" aria-label="再生位置" />
      <span id="clock"></span>
      <button id="rec" type="button">録画して保存</button>
    </div>
    <p class="hint">
      スペースキーで再生／停止、矢印キーで1フレーム送り（Shift で1秒送り）。
      「録画して保存」は webm で書き出します。mp4 が要るときは <code>npm run motion:render</code> を使ってください。
    </p>
    <script type="module" src="/src/motion/main.ts"></script>
  </body>
</html>
